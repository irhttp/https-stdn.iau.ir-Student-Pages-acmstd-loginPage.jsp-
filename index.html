<head>

    <title>تصویر تمام صفحه</title>
    <style>
        /* حذف حاشیه‌های پیش‌فرض مرورگر */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* جلوگیری از اسکرول */
        }

        /* تنظیم عکس برای پر کردن کل صفحه */
        .fullscreen-image {
            width: 100vw;  /* 100% عرض دید */
            height: 100vh; /* 100% ارتفاع دید */
            object-fit: cover; /* عکس را بدون کشیدگی، کل فضا را پر می‌کند */
            display: block;
        }

        /* گزینه جایگزین: اگر می‌خواهید کل عکس دیده شود و کشیده نشود */
